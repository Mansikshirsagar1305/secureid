<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set up Multi-Factor Auth — SecureID</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="mfa-setup">
  <div class="card">
    <div class="stepper" id="stepper"></div>
    <div class="icon-circle">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Set up Multi-Factor Auth</h1>
    <p class="subtitle">Choose how you'd like to protect your account</p>

    <div class="method-list">
      <label class="method selected" data-method="authenticator">
        <input type="radio" name="mfaMethod" checked />
        <span class="method-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 18h6"/></svg>
        </span>
        <span class="method-text">
          <span class="method-title">Authenticator app</span>
          <span class="method-sub">Use Google Authenticator or a similar app</span>
        </span>
      </label>

      <label class="method" data-method="sms">
        <input type="radio" name="mfaMethod" />
        <span class="method-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>
        </span>
        <span class="method-text">
          <span class="method-title">SMS authentication</span>
          <span class="method-sub">Get a code by text message</span>
        </span>
      </label>

      <label class="method" data-method="email">
        <input type="radio" name="mfaMethod" />
        <span class="method-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </span>
        <span class="method-text">
          <span class="method-title">Email authentication</span>
          <span class="method-sub">Get a code by email</span>
        </span>
      </label>
    </div>

    <button type="button" class="btn btn-primary" id="continueBtn">Continue</button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
