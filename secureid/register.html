<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your account — SecureID</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="register">
  <div class="card">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/></svg>
      SecureID
    </div>

    <div class="stepper" id="stepper"></div>
    <h1>Create your account</h1>
    <p class="subtitle">Let's get you started</p>

    <form id="registerForm" novalidate>
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" placeholder="Priya Sharma" autocomplete="name" />
      <div class="error-text" id="err-fullName"></div>

      <label for="phone">Mobile number</label>
      <div class="phone-row">
        <select id="countryCode" name="countryCode" aria-label="Country code">
          <option value="+91">+91</option>
          <option value="+1">+1</option>
          <option value="+44">+44</option>
          <option value="+61">+61</option>
        </select>
        <input type="tel" id="phone" name="phone" placeholder="98765 43210" autocomplete="tel" />
      </div>
      <div class="error-text" id="err-phone"></div>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="priya.sharma@email.com" autocomplete="email" />
      <div class="error-text" id="err-email"></div>

      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" autocomplete="new-password" />
        <button type="button" class="toggle-visibility" data-target="password" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="strength-meter"><span></span><span></span><span></span><span></span></div>
      <div class="strength-label" id="strengthLabel"></div>
      <ul class="req-list">
        <li id="req-len">At least 8 characters</li>
        <li id="req-upperLower">Uppercase &amp; lowercase letters</li>
        <li id="req-number">At least 1 number</li>
        <li id="req-special">At least 1 special character</li>
      </ul>
      <div class="error-text" id="err-password"></div>

      <label for="confirmPassword">Confirm password</label>
      <div class="password-wrap">
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" />
        <button type="button" class="toggle-visibility" data-target="confirmPassword" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="error-text" id="err-confirmPassword"></div>

      <div class="checkbox-row">
        <input type="checkbox" id="terms" name="terms" />
        <label for="terms" style="margin:0;font-weight:400;">
          I agree to the <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a>
        </label>
      </div>
      <div class="error-text" id="err-terms"></div>

      <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <p class="footer-link">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
