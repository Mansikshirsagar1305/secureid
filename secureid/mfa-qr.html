<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scan QR code — SecureID</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="mfa-qr">
  <div class="card">
    <div class="stepper" id="stepper"></div>
    <h1>Scan QR code</h1>
    <p class="subtitle">Open your authenticator app and scan this QR code</p>

    <div class="qr-box" id="qrcode"></div>

    <div class="secret-box" id="secretText" style="display:none;"></div>
    <p class="resend-row" id="setupKeyRow">
      <a href="#" id="setupKeyLink" class="inline-link">Can't scan? Enter setup key</a>
    </p>

    <button type="button" class="btn btn-primary" id="continueBtn">Continue</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
