<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify your email — SecureID</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="verify-email">
  <div class="card">
    <div class="stepper" id="stepper"></div>
    <div class="icon-circle">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    </div>
    <h1>Verify your email</h1>
    <p class="subtitle">We've sent a 6-digit code to<br /><strong id="destination"></strong></p>

    <div class="demo-banner" id="demoBanner"></div>
    <div class="otp-banner" id="otpBanner" style="display:none;"></div>

    <div class="otp-row">
      <input type="text" inputmode="numeric" maxlength="1" />
      <input type="text" inputmode="numeric" maxlength="1" />
      <input type="text" inputmode="numeric" maxlength="1" />
      <input type="text" inputmode="numeric" maxlength="1" />
      <input type="text" inputmode="numeric" maxlength="1" />
      <input type="text" inputmode="numeric" maxlength="1" />
    </div>

    <div class="otp-status" id="otpStatus"></div>
    <button type="button" class="resend-btn" id="resendBtn">Resend New Code</button>

    <button type="button" class="btn btn-primary" id="continueBtn">Verify</button>

    <p class="resend-row">
      Didn't receive the code?
      <a href="#" id="resendLink">Resend code<span id="resendTimer"></span></a>
    </p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
