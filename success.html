<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account created — SecureID</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="success">
  <div class="card" style="text-align:center;">
    <div class="stepper" id="stepper"></div>
    <div class="icon-circle success">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Account created!</h1>
    <p class="subtitle">Your account has been successfully created and secured with MFA</p>

    <ul class="check-list" style="text-align:left;">
      <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg> Email verified</li>
      <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg> Mobile verified</li>
      <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg> MFA enabled</li>
    </ul>

    <a href="login.html" class="btn btn-primary" style="display:block;text-decoration:none;text-align:center;">Continue to Login</a>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
