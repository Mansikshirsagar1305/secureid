<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify your identity — SecureID</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login-choose-method">
  <div class="card">
    <div class="icon-circle">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/></svg>
    </div>
    <h1>Verify your identity</h1>
    <p class="subtitle">Choose a method to continue</p>

    <div class="method-list">
      <label class="method selected" data-method="email">
        <input type="radio" name="loginMethod" checked />
        <span class="method-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </span>
        <span class="method-text">
          <span class="method-title">Email OTP</span>
          <span class="method-sub">Send a code to your email</span>
        </span>
      </label>

      <label class="method" data-method="sms">
        <input type="radio" name="loginMethod" />
        <span class="method-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>
        </span>
        <span class="method-text">
          <span class="method-title">SMS OTP</span>
          <span class="method-sub">Send a code to your phone</span>
        </span>
      </label>

      <label class="method" data-method="authenticator">
        <input type="radio" name="loginMethod" />
        <span class="method-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 18h6"/></svg>
        </span>
        <span class="method-text">
          <span class="method-title">Authenticator app</span>
          <span class="method-sub">Use the code from your app</span>
        </span>
      </label>
    </div>

    <button type="button" class="btn btn-primary" id="continueBtn">Continue</button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
